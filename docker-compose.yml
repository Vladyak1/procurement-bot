version: '3.8'
services:
  procurement-bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./src/main/resources/application.properties:/app/application.properties
    env_file:
      - .env
    environment:
      # AIA-автоподтягивание промежуточного CA при ротации Russian Trusted Sub CA (torgi.gov.ru):
      # enableAIAcaIssuers=true + allowedAIALocations (снимает deny-all фильтр JDK 21 для CDP Нац.УЦ).
      # Валидация сохраняется, но смена Sub CA больше не ломает бота.
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true -Xms96m -Xmx256m -Dfile.encoding=UTF-8 -Duser.timezone=Europe/Moscow -Dcom.sun.security.enableAIAcaIssuers=true -Dcom.sun.security.allowedAIALocations=http://nuc-cdp.digital.gov.ru
    # Адрес Bot API закреплён, чтобы не зависеть от DNS. С 12.11.2026 бот ходит в Telegram
    # через SOCKS-прокси tg-tunnel (PROXY_HOST в .env): напрямую с российского адреса
    # соединения с api.telegram.org то и дело обрывались по таймауту.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    restart: unless-stopped
    # Потолок памяти контейнера. Без него JVM видит всю память ХОСТА (874 МБ) и ставит
    # heap 25% = 220 МБ; при разрастании давила бы на хост целиком. Теперь предел явный,
    # а -Xmx256m внутри лимита оставляет запас на метаспейс и native-память.
    mem_limit: 512m
    # Потолок на stdout-логи контейнера. Без него json-log рос без ограничений и
    # 26.08.2026 забил диск под 100%: бот перестал писать в БД и логи, но продолжал
    # публиковать — лоты уходили в чат по кругу.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Туннель AmneziaWG до VPN на Hetzner — только для Telegram. В AllowedIPs конфига лишь сети
  # Telegram, так что площадки, НСПД и Яндекс туннель не трогает (им нужен российский адрес).
  # Почему AmneziaWG, а не прокси-протокол: 12.11.2026 с этого сервера до Hetzner резались
  # TLS с чужим SNI (VLESS+Reality) и через пару минут — Shadowsocks-2022; UDP AmneziaWG проходит.
  # Конфиг tg-tunnel/awg-tg.conf с приватным ключом — только на сервере, в git не попадает;
  # клиент на Hetzner виден в приложении Amnezia как «procurement-bot (Telegram)».
  tg-tunnel:
    image: amneziavpn/amneziawg-go@sha256:cbafc02b8373a83f428272db6d8001b37bc02e6211cbd8c0cb4e2e3759b12b72
    entrypoint: ["sh", "-c", "awg-quick up /etc/amnezia/amneziawg/awg-tg.conf && exec sleep infinity"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tg-tunnel/awg-tg.conf:/etc/amnezia/amneziawg/awg-tg.conf:ro
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "2"

  # SOCKS5 на tg-tunnel:1080 в сетевом пространстве туннеля — через него бот и ходит в Telegram.
  # Делит сеть с tg-tunnel: после перезапуска туннеля перезапускать и его (docker compose up -d).
  xray-client:
    image: ghcr.io/xtls/xray-core:26.6.1
    command: ["run", "-c", "/etc/xray/config.json"]
    network_mode: "service:tg-tunnel"
    depends_on:
      - tg-tunnel
    volumes:
      - ./xray-client.json:/etc/xray/config.json:ro
    restart: unless-stopped
    mem_limit: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "2"